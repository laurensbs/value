# Generates Rondje.xcodeproj: `brew install xcodegen && xcodegen` in this folder.
# The app's name lives in one place: APP_DISPLAY_NAME below (and Brand.swift reads it at runtime).
name: Rondje
options:
  bundleIdPrefix: app.rondje
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: nl
  createIntermediateGroups: true
settings:
  base:
    APP_DISPLAY_NAME: Rondje Mee
    # The app's bundle id; device.sh gives it a personal suffix for a free Apple account.
    RONDJE_BUNDLE_ID: app.rondje.mobile
    # Entitlements per target; device.sh swaps in empty ones for a free Apple ID.
    RONDJE_APP_ENTITLEMENTS: Rondje/Resources/Rondje.entitlements
    RONDJE_WIDGET_ENTITLEMENTS: RondjeWidgets/RondjeWidgets.entitlements
    # Apple Health needs the HealthKit capability in the App ID. Off (Debug and Release) until that is set up;
    # README.md "Apple Gezondheid aanzetten" says how to turn it on.
    RONDJE_FEATURE_HEALTH: NO
    # Sign in with Apple and Google (ios/README.md): off until the Apple Developer account and the
    # keys are there. Buttons show only with YES here and the provider in the server's /api/v1/config.
    RONDJE_FEATURE_SOCIAL_LOGIN: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Debug:
      # The simulator talks to `npm run dev` on this Mac (cd web && npx next dev -p 3100).
      RONDJE_API_BASE_URL: http:/$()/localhost:3100
    Release:
      RONDJE_API_BASE_URL: https:/$()/rondjemee.nl
targets:
  Rondje:
    type: application
    platform: iOS
    sources:
      - path: Rondje
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RONDJE_BUNDLE_ID)
        INFOPLIST_FILE: Rondje/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(RONDJE_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: RondjeWidgets
  RondjeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RondjeWidgets
      - path: Shared
      - path: Rondje/UI/DogFace.swift
      - path: Rondje/UI/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RONDJE_BUNDLE_ID).widgets
        INFOPLIST_FILE: RondjeWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(RONDJE_WIDGET_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"
  RondjeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RondjeTests
    dependencies:
      - target: Rondje
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rondje.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Rondje.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Rondje
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Rondje:
    build:
      targets:
        Rondje: all
        RondjeWidgets: all
    test:
      targets:
        - RondjeTests
    run:
      config: Debug
    archive:
      config: Release
