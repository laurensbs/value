<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rondje Mee · geen verbinding</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f6f0; --ink: #16201a; --muted: #55635a; --grass: #1f5a3d; --on-grass: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d1310; --ink: #e7eee8; --muted: #9eafa4; --grass: #8fdcae; --on-grass: #0d1310; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font: 17px/1.5 -apple-system, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; display: grid; gap: 14px; text-align: center; justify-items: center; }
      h1 { font-size: 1.5rem; margin: 0; }
      p { margin: 0; color: var(--muted); }
      button { font: inherit; font-weight: 650; border: 0; border-radius: 999px; padding: 12px 22px; background: var(--grass); color: var(--on-grass); }
      .tel { color: var(--ink); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#1f5a3d"/><circle cx="32" cy="32" r="14" fill="none" stroke="#d9f05a" stroke-width="5" stroke-dasharray="4 7" stroke-linecap="round"/><circle cx="32" cy="18" r="5.5" fill="#d9f05a"/></svg>
      <h1>Geen verbinding</h1>
      <p>Rondje Mee heeft internet nodig. Controleer je verbinding en probeer het opnieuw.</p>
      <!-- Keep in sync with server.url in capacitor.config.ts -->
      <button type="button" onclick="location.replace('https://rondjemee.nl/')">Opnieuw proberen</button>
      <p>Noodgeval tijdens een rondje? Bel <a class="tel" href="tel:112">112</a>.</p>
    </main>
  </body>
</html>
